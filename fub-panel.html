<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Starling AI</title>
<style>
  :root{--navy:#080C17;--coral:#F15368;--peri:#868BDF;--blush:#FFA0A8;--ink:#1f2633;--muted:#6b7280;--line:#e6e8ee;--bg:#ffffff;--soft:#f6f7fb;--green:#16a36a;--amber:#c98a07;--gray:#8a919e}
  *{box-sizing:border-box}
  body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{padding:12px 12px 10px}
  .head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .head img{width:26px;height:24px;border-radius:5px;background:var(--navy);padding:2px}
  .head .t{font-weight:700;font-size:13px;letter-spacing:.1px}
  .head .t b{color:var(--coral);font-weight:700}
  .head .sub{margin-left:auto;font-size:11px;color:var(--muted);max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:600;font-size:12px}
  .pill i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .s-active{background:#e9f8f1;color:#0f7a4f}.s-active i{background:var(--green)}
  .s-meeting{background:#eef0ff;color:#3d43a8}.s-meeting i{background:var(--peri)}
  .s-opted{background:#fdecee;color:#b3263a}.s-opted i{background:var(--coral)}
  .s-none{background:var(--soft);color:#4b5563}.s-none i{background:var(--gray)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .ago{font-size:11px;color:var(--muted)}
  .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin:12px 0 6px}
  .thread{display:flex;flex-direction:column;gap:6px}
  .b{max-width:88%;padding:7px 10px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;font-size:12.5px}
  .b small{display:block;font-size:10px;opacity:.7;margin-top:3px}
  .ai{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
  .lead{align-self:flex-start;background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:4px}
  .meet{align-self:center;background:#eef0ff;color:#3d43a8;border-radius:8px;font-weight:600;font-size:11.5px;text-align:center}
  .empty{background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:12px;color:#4b5563;text-align:center}
  .usage{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:10px}
  .usage .top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
  .usage .top span{color:var(--muted)}
  .bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
  .bar div{height:100%;background:linear-gradient(90deg,var(--peri),var(--coral));border-radius:99px}
  .foot{margin-top:12px;padding-top:8px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
  a{color:var(--coral);text-decoration:none;font-weight:600}
  .pitch{background:var(--navy);color:#fff;border-radius:12px;padding:14px}
  .pitch img{width:34px;height:31px;margin-bottom:6px}
  .pitch h3{margin:0 0 8px;font-size:15px;line-height:1.3}
  .pitch h3 b{color:var(--blush)}
  .pitch ul{margin:0 0 12px;padding-left:16px;color:#d9dcef}
  .pitch li{margin:3px 0}
  .btn{display:block;text-align:center;background:var(--coral);color:#fff;padding:9px;border-radius:8px;font-weight:700}
  .pitch .es{margin-top:8px;font-size:11px;color:#aeb3d6;text-align:center}
  .tiny{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:center}
  .msg{padding:12px;border-radius:10px;background:var(--soft);color:#374151}
  .msg b{display:block;margin-bottom:3px;color:var(--ink)}
  .sk{height:12px;border-radius:6px;background:linear-gradient(90deg,#eef0f4,#f7f8fb,#eef0f4);background-size:200% 100%;animation:sh 1.2s infinite;margin:8px 0}
  @keyframes sh{to{background-position:-200% 0}}
</style>
</head>

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function head(sub) { return '<div class="head"><img alt="" src="' + BIRD + '"><div class="t">Starling <b>AI</b></div>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div>'; }
  function ago(iso) {
    if (!iso) return ""; var d = new Date(iso); if (isNaN(d)) return "";
    var s = Math.max(0, (Date.now() - d.getTime()) / 1000);
    if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago"; if (s < 86400 * 30) return Math.floor(s / 86400) + "d ago";
    return d.toLocaleDateString();
  }
  function when(iso) { var d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
  function meetText(t) {
    return String(t).replace(/(\d{4}-\d{2}-\d{2}T[\d:.]+(?:Z|[+-]\d{2}:?\d{2})?)/, function (m) {
      var d = new Date(m); return isNaN(d) ? m : "for " + d.toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    });
  }
  function foot() { return '<div class="foot"><span>Powered by Starling AI</span><a href="' + SITE + '" target="_blank" rel="noopener">starlingagent.com</a></div>'; }
  function usageBox(u) {
    if (!u || u.used == null) return "";
    var lim = Number(u.limit) || 0, pct = lim ? Math.min(100, Math.round((u.used / lim) * 100)) : 0;
    return '<div class="usage"><div class="top"><strong>Texts this month</strong><span>' + Number(u.used).toLocaleString() + (lim ? " / " + lim.toLocaleString() : "") + '</span></div>' +
      (lim ? '<div class="bar"><div style="width:' + pct + '%"></div></div>' : '') + '</div>';
  }
  var STATUS = {
    active: ["s-active", "AI is working this lead"],
    meeting_booked: ["s-meeting", "Meeting booked"],
    opted_out: ["s-opted", "Lead opted out"],
    not_contacted: ["s-none", "Not contacted yet"]
  };

  function renderWorking(r) {
    var st = STATUS[r.status] || STATUS.not_contacted;
    var h = head(r.client_name) +
      '<div class="row"><span class="pill ' + st[0] + '"><i></i>' + st[1] + '</span><span class="ago">' + esc(ago(r.last_activity)) + '</span></div>';
    var msgs = r.messages || [];
    if (msgs.length) {
      h += '<div class="label">Latest conversation</div><div class="thread">';
      msgs.forEach(function (m) {
        if (m.from === "meeting") { h += '<div class="b meet">📅 ' + esc(meetText(m.text)) + '</div>'; return; }
        var cls = m.from === "ai" ? "ai" : "lead", who = m.from === "ai" ? "Starling" : (r.lead_first_name || "Lead");
        h += '<div class="b ' + cls + '">' + esc(m.text) + '<small>' + esc(who) + (m.at ? " · " + esc(when(m.at)) : "") + '</small></div>';
      });
      h += '</div>';
    } else {
      h += '<div class="empty">Starling hasn\'t texted ' + esc(r.lead_first_name || "this lead") + ' yet.</div>';
    }
    return h + usageBox(r.usage) + foot();
  }
  function renderPitch(r) {
    return head() + '<div class="pitch"><img alt="" src="' + BIRD + '">' +
      '<h3>Put an <b>AI agent</b> on your Follow Up Boss leads</h3>' +
      '<ul><li>Texts new leads in seconds, 24/7</li><li>Qualifies buyers &amp; sellers and books appointments</li><li>Wakes up old leads in your database</li><li>English &amp; Spanish</li></ul>' +
      '<a class="btn" href="' + SITE + '" target="_blank" rel="noopener">See how it works</a>' +
      '<div class="es">Hablamos español · Atendemos a tus leads en español</div></div>' +
      (r.account_id ? '<div class="tiny">FUB account ID: ' + esc(r.account_id) + '</div>' : '');
  }
  function renderMsg(title, text) { return head() + '<div class="msg"><b>' + esc(title) + '</b>' + esc(text) + '</div>' + foot(); }

  function render(r) {
    var s = r && r.state;
    if (s === "working") app.innerHTML = renderWorking(r);
    else if (s === "account_not_found") app.innerHTML = renderPitch(r);
    else if (s === "person_not_found") app.innerHTML = head() + '<div class="empty">Starling hasn\'t texted this lead yet.</div>' + usageBox(r.usage) + foot();
    else if (s === "user_not_found") app.innerHTML = renderMsg("You're not set up in Starling yet", "Ask your Follow Up Boss admin to add you to your team's Starling AI account.");
    else if (s === "unauthorized") app.innerHTML = renderMsg("No access", "You don't have access to Starling AI details for this lead.");
    else if (s === "invalid") app.innerHTML = renderMsg("Couldn't verify this request", "Please reload the page. If this keeps happening, email Admin@starlingagent.com.");

  }

  var context = q.get("context"), signature = q.get("signature");
  if (!context || !signature) {
    app.innerHTML = renderMsg("Starling AI for Follow Up Boss", "This panel opens inside Follow Up Boss, on a lead's profile.");
    return;
  }
  var body = new URLSearchParams(); body.set("context", context); body.set("signature", signature);
  var done = false;
  var timer = setTimeout(function () { if (!done) app.innerHTML = renderMsg("Still loading…", "Starling is taking longer than usual. Try reloading the lead."); }, 12000);
  fetch(API_URL, { method: "POST", body: body })
    .then(function (res) { return res.json().catch(function () { return { state: "invalid" }; }); })
    .then(function (r) { done = true; clearTimeout(timer); render(r); })
    .catch(function () { done = true; clearTimeout(timer); app.innerHTML = renderMsg("Couldn't reach Starling", "Please reload in a moment. If this keeps happening, email Admin@starlingagent.com."); });
