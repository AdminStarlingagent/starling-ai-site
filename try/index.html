<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080C17">
<title>Text the AI | Starling AI</title>
<meta name="description" content="Play the lead. Starling AI texts you the way it texts real leads.">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#080C17; --navy-deep:#05080F; --surface:#151C30; --surface-2:#1B2440;
    --line:rgba(134,139,223,.22);
    --peri:#868BDF; --coral:#F15368; --blush:#FFA0A8;
    --ink:#E9EBF7; --mute:#9AA1BD;
    --display:"Plus Jakarta Sans",Inter,ui-sans-serif,system-ui,sans-serif;
    --body:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--navy-deep);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
  body{overflow:hidden}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--blush);outline-offset:2px;border-radius:6px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- shell ---------- */
  .app{
    height:var(--vh,100dvh);max-width:480px;margin:0 auto;display:flex;flex-direction:column;
    background:var(--navy);border-inline:1px solid var(--line);
    padding-top:env(safe-area-inset-top,0px);
  }
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
  .brand img{width:34px;height:34px;border-radius:9px;display:block}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
  .lang button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:.8125rem;font-weight:600;color:var(--mute);min-width:44px}
  .lang button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}

  .ribbon{margin:0;padding:8px 16px;font-size:.8125rem;line-height:1.35;background:#3A2A12;color:#FFD9A0;border-bottom:1px solid #6B4E1E}

  /* ---------- thread ---------- */
  .thread{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:20px 16px 12px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
  .intro{padding:8px 0 4px}
  .intro h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,9vw,2.6rem);line-height:1.04;letter-spacing:-.03em;margin:0 0 12px}
  .intro p{margin:0 0 22px;color:var(--mute);font-size:1rem;line-height:1.5;max-width:34ch}
  .roles{display:grid;gap:10px}
  .role{
    text-align:left;border:1px solid var(--line);background:var(--surface);padding:15px 44px 15px 16px;border-radius:14px;
    /* folded corner, the one origami nod on the page */
    clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,0 100%);position:relative;transition:background .15s,border-color .15s;
  }
  .role::after{content:"";position:absolute;top:0;right:0;width:26px;height:26px;background:linear-gradient(225deg,transparent 50%,var(--peri) 50%);opacity:.55}
  .role:hover,.role:focus-visible{background:var(--surface-2);border-color:var(--peri)}
  .role:focus-visible{outline-offset:-3px}
  .role b{display:block;font-family:var(--display);font-weight:700;font-size:1.0625rem;letter-spacing:-.01em}
  .role span{display:block;margin-top:3px;color:var(--mute);font-size:.875rem}
  .role[disabled]{opacity:.5;cursor:default}

  .sys{align-self:center;text-align:center;color:var(--mute);font-size:.8125rem;line-height:1.45;max-width:30ch;margin:14px 0 10px}
  .row{display:flex;flex-direction:column;max-width:82%}
  .row.ai{align-self:flex-start;align-items:flex-start}
  .row.me{align-self:flex-end;align-items:flex-end}
  .bubble{padding:10px 14px;border-radius:20px;font-size:1rem;line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .16s ease-out}
  .ai .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
  .me .bubble{background:var(--peri);color:var(--navy);border-bottom-right-radius:6px;font-weight:500}
  .bubble a{color:inherit;text-decoration:underline;text-underline-offset:2px}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- the stopwatch: speed-to-lead, measured live ---------- */
  .wait{display:flex;align-items:center;gap:10px}
  .dots{display:flex;gap:5px;padding:14px 14px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:blink 1.1s infinite}
  .dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .clock{font-family:var(--display);font-weight:700;font-size:1.0625rem;color:var(--coral);font-variant-numeric:tabular-nums;letter-spacing:-.01em;min-width:3.4ch}
  .took{margin:5px 0 8px 4px;font-size:.8125rem;color:var(--mute)}
  .took b{font-family:var(--display);font-weight:700;color:var(--coral);font-variant-numeric:tabular-nums}

  /* coach note: what the AI just did and why it converts (agent-facing) */
  .coach{margin:6px 0 10px 4px;max-width:88%;padding:9px 12px 9px 14px;border-left:3px solid var(--peri);background:rgba(134,139,223,.10);border-radius:0 12px 12px 0;font-size:.8125rem;line-height:1.45;color:var(--ink)}
  .coach b{display:block;font-family:var(--display);font-weight:700;font-size:.6875rem;letter-spacing:.02em;color:var(--peri);margin-bottom:2px}
  /* the reveal: shown once the roleplay books a meeting */
  .reveal{align-self:stretch;margin:12px 0 6px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,rgba(241,83,104,.12),rgba(134,139,223,.12))}
  .reveal b{display:block;font-family:var(--display);font-weight:700;font-size:1.0625rem;letter-spacing:-.01em;margin-bottom:4px}
  .reveal p{margin:0;font-size:.9375rem;line-height:1.45;color:var(--ink)}
  .chips{display:flex;gap:8px;padding:0 12px 6px;flex-wrap:wrap}
  .chip{border:1px solid var(--peri);background:none;color:var(--ink);border-radius:999px;padding:7px 13px;font-size:.8125rem;font-weight:600}
  .chip:hover,.chip:focus-visible{background:var(--surface-2)}
  .err{align-self:stretch;margin:8px 0;padding:12px 14px;border:1px solid rgba(241,83,104,.5);border-radius:12px;background:rgba(241,83,104,.08);font-size:.9375rem;line-height:1.4;display:flex;gap:12px;align-items:center;justify-content:space-between}
  .err button{flex:none;border:1px solid var(--coral);background:none;color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.875rem}

  /* ---------- call to action + composer ---------- */
  .cta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 16px;border-top:1px solid var(--line);background:var(--surface)}
  .cta p{margin:0;font-size:.9375rem;line-height:1.3;font-weight:500}
  .cta a{flex:none;background:var(--coral);color:#fff;text-decoration:none;font-weight:600;font-size:.9375rem;padding:10px 16px;border-radius:999px}
  .cta a:hover{filter:brightness(1.08)}
  .composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
  .composer textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:22px;padding:11px 16px;font:inherit;font-size:16px;line-height:1.35;max-height:120px;outline:none}
  .composer textarea:focus{border-color:var(--peri)}
  .composer textarea::placeholder{color:var(--mute)}
  .send{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--coral);display:grid;place-items:center;transition:opacity .15s}
  .send svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .send[disabled]{opacity:.35;cursor:default}
  .fine{margin:0;padding:0 16px calc(10px + env(safe-area-inset-bottom,0px));font-size:.75rem;line-height:1.4;color:var(--mute);display:flex;justify-content:space-between;gap:12px}
  .fine button{border:0;background:none;padding:0;color:var(--mute);text-decoration:underline;text-underline-offset:2px;font-size:.75rem;flex:none}
  /* "Text me": the one real-world step on this page (opt-in texts from Starling AI) */
  .optin{align-self:stretch;margin:12px 0 6px;padding:16px;border:1px solid var(--peri);border-radius:14px;background:var(--surface)}
  .optin h2{margin:0 0 4px;font-family:var(--display);font-weight:700;font-size:1.0625rem;letter-spacing:-.01em}
  .optin > p{margin:0 0 6px;font-size:.9375rem;line-height:1.45}
  .optin label.f{display:block;margin:12px 0 5px;font-size:.8125rem;font-weight:600;color:var(--mute)}
  .optin input.t{width:100%;border:1px solid var(--line);background:var(--navy);color:var(--ink);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;outline:none}
  .optin input.t:focus{border-color:var(--peri)}
  .optin input.t:disabled{opacity:.7}
  .optin .consent{display:flex;gap:10px;align-items:flex-start;margin-top:16px}
  .optin .consent input{flex:none;width:20px;height:20px;margin:1px 0 0;accent-color:var(--coral)}
  .optin .consent label{font-size:.75rem;line-height:1.5;color:var(--mute)}
  .optin .legal{margin:6px 0 0 30px;font-size:.75rem;line-height:1.5;color:var(--mute)}
  .optin .legal a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
  .optin .go{display:block;width:100%;margin-top:14px;border:0;border-radius:999px;background:var(--coral);color:#fff;font-weight:600;font-size:.9375rem;padding:12px 16px}
  .optin .go[disabled]{opacity:.5;cursor:default}
  .optin .msg{margin:10px 0 0;font-size:.875rem;line-height:1.4}
  .optin .msg:empty{display:none}
  .optin .msg.bad{color:var(--blush)}
  .optin.done{border-color:var(--line)}
  .optin.done .msg{font-weight:600}
  .hp{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important;overflow:hidden!important}
  .cta .acts{display:flex;gap:8px;flex:none}
  .cta button.alt{border:1px solid var(--coral);background:none;color:var(--ink);font-weight:600;font-size:.9375rem;padding:9px 14px;border-radius:999px}
  .err .btns{display:flex;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end}
  @media (max-width:420px){.cta{flex-wrap:wrap}.cta p{flex-basis:100%}}
  [hidden]{display:none!important}

  @media (prefers-reduced-motion:reduce){
    .bubble,.dots i{animation:none}.dots i{opacity:.7}.thread{scroll-behavior:auto}
  }
</style>
</head>

              "Perfecto, eso me ayuda. ¿Ya hablaste con un prestamista o te sirve que te presente a uno?",
              "Excelente. Puedo agendarte una llamada de 15 minutos con el equipo. ¿Te queda mejor mañana a las 10am o a las 4pm?",
              "Listo, quedas agendado para mañana a las 10:00 AM hora central. ¿Algo más en lo que te pueda ayudar?",
              "Esto fue lo que pasó en tu conversación: el primer mensaje salió en menos de un segundo, se capturaron tres respuestas de calificación y la cita se agendó sin ninguna persona de por medio. ¿De dónde llegan la mayoría de tus leads hoy?"],
    previewInsight: ["Primero el tiempo: un lead con ventana de 3 meses recibe una propuesta de cita en mi tercera respuesta, justo donde muchos agentes pierden el hilo.",
                     "Una pregunta a la vez. Un lead que se siente interrogado deja de contestar; uno que se siente ayudado sigue escribiendo.",
                     "Dos horarios concretos, no un '¿cuándo te queda bien?'. Una decisión fácil agenda más citas que una pregunta abierta.",
                     "Agendado, confirmado y anotado en el CRM sin que tocaras tu teléfono."]
  }
};

const qs = new URLSearchParams(location.search);
const $  = id => document.getElementById(id);
const thread = $("thread"), intro = $("intro"), msg = $("msg"), sendBtn = $("send"), cta = $("cta");

const S = {
  lang: (qs.get("lang") || navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en",
  preview: qs.has("preview") || !CONFIG.WEBHOOK_URL,
  src: (qs.get("s") || "direct").slice(0, 40),
  sessionId: newId(), scenario: null, phase: "roleplay", turns: 0, replies: 0, busy: false, capped: false, previewStep: 0,
  log: [], optin: null, optinDone: false, fails: 0
};

function newId(){
  return (crypto.randomUUID ? crypto.randomUUID() : "s-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
}
const t = k => T[S.lang][k];

/* ---------- language ---------- */
function setLang(l){
  S.lang = l; document.documentElement.lang = l;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  msg.placeholder = S.phase === "pitch" ? t("placeholderPitch") : (S.scenario ? t("placeholder") : t("placeholderIdle"));
  document.title = (l === "es" ? "Escríbele a la IA" : "Text the AI") + " | Starling AI";
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

/* ---------- thread helpers ---------- */
function toBottom(){ thread.scrollTop = thread.scrollHeight; }
function el(tag, cls, text){ const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function addSys(text){ thread.appendChild(el("p", "sys", text)); toBottom(); }
function linkify(node, text){
  text.split(/(https?:\/\/[^\s]+)/g).forEach(part => {
    if (/^https?:\/\//.test(part)) { const a = el("a", "", part); a.href = part; a.target = "_blank"; a.rel = "noopener"; node.appendChild(a); }
    else node.appendChild(document.createTextNode(part));
  });
}
function addBubble(who, text){
  const row = el("div", "row " + who), b = el("div", "bubble");
  S.log.push({ who, text: String(text).slice(0, 600) });
  linkify(b, text); row.appendChild(b); thread.appendChild(row); toBottom(); return row;
}
function fmt(ms){ return (ms / 1000).toFixed(1) + t("unit"); }
function addCoach(text){ const c = el("div", "coach"); c.appendChild(el("b", "", t("coachLabel"))); c.appendChild(document.createTextNode(text)); thread.appendChild(c); toBottom(); }
function enterPitch(reveal){
  if (reveal && S.phase !== "pitch"){ const r = el("div", "reveal"); r.appendChild(el("b", "", t("revealTitle"))); r.appendChild(el("p", "", t("revealBody"))); thread.appendChild(r); }
  S.phase = "pitch"; msg.placeholder = t("placeholderPitch"); $("chips").hidden = true; cta.hidden = false; toBottom();
}

/* typing row with a live stopwatch; resolves to the elapsed ms when stopped */
function startWait(){
  const row = el("div", "row ai"), wrap = el("div", "wait"), b = el("div", "bubble dots"), clock = el("span", "clock", fmt(0));
  b.append(el("i"), el("i"), el("i")); b.setAttribute("aria-hidden", "true"); clock.setAttribute("aria-hidden", "true");
  wrap.append(b, clock); row.appendChild(wrap); thread.appendChild(row); toBottom();
  const t0 = performance.now(), tick = setInterval(() => { clock.textContent = fmt(performance.now() - t0); }, 100);
  return { stop(){ clearInterval(tick); row.remove(); return performance.now() - t0; } };
}

/* ---------- talking to n8n ---------- */
function pickReply(data){
  if (Array.isArray(data)) data = data[0];
  if (data == null) return { text: "" };
  if (typeof data === "string") return { text: data };
  return { text: data.reply ?? data.output ?? data.text ?? data.message ?? "", cta: !!data.cta, end: !!data.end,
           insight: typeof data.insight === "string" ? data.insight.trim() : "", booked: !!data.booked, phase: data.phase || "", busy: !!data.busy };
}
async function askAI(payload){
  if (S.preview){
    await new Promise(r => setTimeout(r, 1200 + Math.random() * 1300));
    const step = S.previewStep++, script = t("preview"), notes = t("previewInsight");
    if (S.phase === "pitch") return { text: script[script.length - 1], phase: "pitch" };
    const i = Math.min(step, script.length - 2);
    return { text: script[i], insight: notes[Math.min(i, notes.length - 1)], booked: i === script.length - 2, phase: i === script.length - 2 ? "pitch" : "roleplay" };
  }
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), CONFIG.TIMEOUT_MS);
  try {
    const res = await fetch(CONFIG.WEBHOOK_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload), signal: ctrl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const raw = await res.text(); let data; try { data = JSON.parse(raw); } catch { data = raw; }
    const out = pickReply(data);
    if (out.busy){ const err = new Error("busy"); err.busy = true; throw err; }
    if (!out.text.trim()) throw new Error("Empty reply"); return out;
  } finally { clearTimeout(timer); }
}

async function exchange(event, text){
  if (S.busy) return;
  S.busy = true; refreshSend();
  const payload = { sessionId: S.sessionId, event, scenario: S.scenario, lang: S.lang, message: text || "", turn: S.turns, phase: S.phase, src: S.src };
  const wait = startWait();
  try {
    const out = await askAI(payload), ms = wait.stop();
    S.fails = 0;
    const parts = out.text.trim().split(/\n{2,}/).slice(0, 3);
    let last; parts.forEach(p => { last = addBubble("ai", p.trim()); });
    const took = el("p", "took"); took.append((event === "start" ? t("first") : t("replied")) + " ", el("b", "", fmt(ms)));
    last.appendChild(took); toBottom();
    S.replies++;
    if (out.insight && S.phase !== "pitch") addCoach(out.insight);
    if (out.booked) enterPitch(true);
    else if (out.phase === "pitch" && S.phase !== "pitch") enterPitch(false);
    if (S.phase !== "pitch" && S.replies >= 1) $("chips").hidden = false;
    if (out.cta || S.replies >= CONFIG.CTA_AFTER_REPLIES) cta.hidden = false;
    if (S.phase === "pitch") showOptin();
    if (out.end || S.turns >= CONFIG.MAX_TURNS) endThread();
  } catch (e) {
    wait.stop(); S.fails++; showError(() => exchange(event, text), !!(e && e.busy));
  } finally {
    S.busy = false; refreshSend(); toBottom();
  }
}
function showError(retry, busy){
  const box = el("div", "err"); box.setAttribute("role", "alert");
  const btns = el("div", "btns");
  const btn = el("button", "", t("retry")); btn.type = "button";
  btn.addEventListener("click", () => { box.remove(); retry(); });
  btns.appendChild(btn);
  if (S.fails >= 2 && !S.preview){          // live AI keeps failing: offer the sample script instead
    const s = el("button", "", t("sample")); s.type = "button";
    s.addEventListener("click", () => { box.remove(); startSample(); });
    btns.appendChild(s);
  }
  box.append(el("span", "", busy ? t("busy") : t("error")), btns); thread.appendChild(box); toBottom();
}
function endThread(){
  if (S.capped) return; S.capped = true; addSys(t("capped")); cta.hidden = false; msg.disabled = true; refreshSend(); showOptin();
}

/* ---------- "Text me": the one real-world step on this page ----------
   Opt-in only. Sends name, mobile, optional email, the consent text shown and the
   demo chat to the Starling "Text me" workflow, which saves the contact in
   Starling's CRM. Starling AI then texts them for real. ?preview=1 never sends. */
const CAPTURE_SIMULATED = qs.has("preview");
function optinField(id, key, type, auto, mode){
  const wrap = el("div"), lab = el("label", "f", t(key)), inp = el("input", "t");
  lab.htmlFor = id; lab.dataset.i18n = key;
  inp.id = id; inp.type = type; inp.autocomplete = auto; if (mode) inp.inputMode = mode;
  wrap.append(lab, inp); return { wrap, inp };
}
function showOptin(){
  if (!CONFIG.CAPTURE_URL || S.optinDone || S.optin) return;
  const card = el("section", "optin");
  const h = el("h2", "", t("optinTitle")); h.dataset.i18n = "optinTitle";
  const p = el("p", "", t("optinBody")); p.dataset.i18n = "optinBody";
  const nm = optinField("oName", "optinName", "text", "name");
  const ph = optinField("oPhone", "optinPhone", "tel", "tel", "tel");
  const em = optinField("oEmail", "optinEmail", "email", "email", "email");
  const hp = el("input", "hp"); hp.type = "text"; hp.tabIndex = -1; hp.autocomplete = "off"; hp.setAttribute("aria-hidden", "true");
  const row = el("div", "consent"), box = el("input"), lab = el("label", "", t("optinConsent"));
  box.type = "checkbox"; box.id = "oConsent"; lab.htmlFor = "oConsent"; lab.dataset.i18n = "optinConsent";
  row.append(box, lab);
  const legal = el("p", "legal");
  const see = el("span", "", t("optinSee")), and = el("span", "", t("optinAnd"));
  const a1 = el("a", "", t("optinPrivacy")), a2 = el("a", "", t("optinSms"));
  see.dataset.i18n = "optinSee"; and.dataset.i18n = "optinAnd"; a1.dataset.i18n = "optinPrivacy"; a2.dataset.i18n = "optinSms";
  a1.href = "/privacy"; a2.href = "/sms-compliance#demo-texts"; [a1, a2].forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  legal.append(see, " ", a1, " ", and, " ", a2, ".");
  const go = el("button", "go", t("optinGo")); go.type = "button"; go.dataset.i18n = "optinGo";
  const note = el("p", "msg"); note.setAttribute("role", "status");
  card.append(h, p, nm.wrap, ph.wrap, em.wrap, hp, row, legal, go, note);
  go.addEventListener("click", submitOptin);
  S.optin = { card, name: nm.inp, phone: ph.inp, email: em.inp, hp, box, consent: lab, legal, go, note, sending: false };
  thread.appendChild(card); toBottom();
}
async function submitOptin(){
  const o = S.optin; if (!o || o.sending || S.optinDone) return;
  const say = (key, bad) => { o.note.className = bad ? "msg bad" : "msg"; o.note.textContent = t(key); toBottom(); };
  const name = o.name.value.trim(), email = o.email.value.trim();
  let digits = o.phone.value.replace(/\D/g, ""); if (digits.length === 11 && digits[0] === "1") digits = digits.slice(1);
  if (!name) return say("optinErrName", true);
  if (!/^[2-9]\d{2}[2-9]\d{6}$/.test(digits)) return say("optinErrPhone", true);
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return say("optinErrEmail", true);
  if (!o.box.checked) return say("optinErrConsent", true);
  o.sending = true; o.go.disabled = true; o.go.textContent = t("optinSending"); o.note.textContent = "";
  const payload = {
    sessionId: S.sessionId, name, phone: digits, email, consent: true,
    consent_text: (o.consent.textContent + " " + o.legal.textContent).replace(/\s+/g, " ").trim(),
    lang: S.lang, scenario: S.scenario || "open", src: S.src, page: location.href.slice(0, 300),
    transcript: S.log.slice(-40), company_website: o.hp.value
  };
  let res = null;
  try {
    if (CAPTURE_SIMULATED){ await new Promise(r => setTimeout(r, 700)); res = { ok: true }; }
    else {
      const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 20000);
      try {
        const r = await fetch(CONFIG.CAPTURE_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload), signal: ctrl.signal });
        const raw = await r.text(); try { res = JSON.parse(raw); } catch { res = null; }
        if (Array.isArray(res)) res = res[0];
      } finally { clearTimeout(timer); }
    }
  } catch (e) { res = null; }
  o.sending = false;
  if (res && res.ok){
    S.optinDone = true; o.card.classList.add("done");
    [o.name, o.phone, o.email, o.box].forEach(i => { i.disabled = true; });
    o.go.hidden = true; $("textMeBtn").hidden = true;
    o.note.dataset.i18n = "optinDone"; say("optinDone", false);
  } else {
    o.go.disabled = false; o.go.textContent = t("optinGo");
    const map = { phone_invalid: "optinErrPhone", consent_required: "optinErrConsent", name_required: "optinErrName", email_invalid: "optinErrEmail", busy: "optinErrBusy" };
    say(map[res && res.error] || "optinErrFail", true);
  }
}
function resetThread(){
  Object.assign(S, { sessionId: newId(), scenario: null, phase: "roleplay", turns: 0, replies: 0, capped: false, previewStep: 0, log: [], optin: null, fails: 0 });
  [...thread.children].forEach(n => { if (n !== intro) n.remove(); });
  intro.hidden = false; cta.hidden = true; $("chips").hidden = true; msg.disabled = false; msg.value = ""; autosize();
  msg.placeholder = t("placeholderIdle"); refreshSend(); thread.scrollTop = 0;
}
function startSample(){
  const role = S.scenario && S.scenario !== "open" ? S.scenario : "buyer";
  S.preview = true; $("ribbon").hidden = false; resetThread(); start(role);
}

/* ---------- start, send, restart ---------- */
function start(role){
  if (S.scenario) return;
  S.scenario = role; intro.hidden = true; msg.placeholder = t("placeholder");
  addSys(t("sys" + role[0].toUpperCase() + role.slice(1)) + " " + t("sysWatch"));
  exchange("start");
}
document.querySelectorAll(".role").forEach(b => b.addEventListener("click", () => start(b.dataset.role)));

function refreshSend(){ sendBtn.disabled = S.busy || S.capped || !msg.value.trim(); }
function autosize(){ msg.style.height = "auto"; msg.style.height = Math.min(msg.scrollHeight, 120) + "px"; }
msg.addEventListener("input", () => { autosize(); refreshSend(); });
msg.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); $("composer").requestSubmit(); } });
$("composer").addEventListener("submit", e => {
  e.preventDefault();
  const text = msg.value.trim(); if (!text || S.busy || S.capped) return;
  if (!S.scenario){ S.scenario = "open"; intro.hidden = true; msg.placeholder = t("placeholder"); }  // typed without picking a role
  msg.value = ""; autosize(); S.turns++;
  addBubble("me", text); exchange("message", text);
});
$("pitchChip").addEventListener("click", () => {
  if (S.busy || S.capped) return;
  if (!S.scenario) S.scenario = "open";
  enterPitch(false); S.turns++;
  const q = t("pitchAsk"); addBubble("me", q); exchange("message", q);
});
$("restart").addEventListener("click", () => { if (S.busy) return; resetThread(); });

/* keep the composer above the phone keyboard */
const vv = window.visualViewport;
function fit(){ document.documentElement.style.setProperty("--vh", (vv ? vv.height : innerHeight) + "px"); window.scrollTo(0, 0); toBottomIfChatting(); }
function toBottomIfChatting(){ if (S.scenario) toBottom(); }
if (vv) vv.addEventListener("resize", fit); window.addEventListener("resize", fit); fit();

$("ctaLink").href = CONFIG.BOOKING_URL;
$("textMeBtn").hidden = !CONFIG.CAPTURE_URL;
$("textMeBtn").addEventListener("click", () => { showOptin(); if (S.optin) S.optin.card.scrollIntoView({ block: "nearest" }); });
$("ribbon").hidden = !S.preview;
setLang(S.lang); refreshSend();
</script>
</body>
