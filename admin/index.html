<style>
:root{
  --navy:#080C17; --navy-2:#0D1526; --navy-3:#141E35; --navy-4:#1B2743;
  --coral:#F15368; --peri:#868BDF; --blush:#FFA0A8;
  --paper:#EEF0F6; --muted:#8B94AC; --dim:#69728A;
  --line:rgba(134,139,223,.20); --line-2:rgba(134,139,223,.36);
  --ok:#4ED4A0; --warn:#FFC46B;
}
/* ── A2P status control ── */
.a2pseg{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.a2pseg button{font:600 12.5px/1 'IBM Plex Sans',sans-serif;letter-spacing:.02em;color:var(--muted);
  background:var(--navy-3);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:border-color .12s,color .12s,background .12s,transform .12s}
.a2pseg button i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.a2pseg button:hover{border-color:var(--line-2);color:var(--paper);transform:translateY(-1px)}
.a2pseg button:focus-visible{outline:2px solid var(--peri);outline-offset:2px}
.a2pseg button.on{color:var(--navy);font-weight:700}
.a2pseg button.on.sub{background:var(--peri);border-color:var(--peri)}
.a2pseg button.on.reg{background:var(--warn);border-color:var(--warn)}
.a2pseg button.on.ok{background:var(--ok);border-color:var(--ok)}
.a2pseg button.on.bad{background:var(--coral);border-color:var(--coral)}
.a2phint{font-size:12px;color:var(--dim);margin:-8px 0 14px}
.a2ptag{font-weight:600}
.a2ptag.sub{color:var(--peri)} .a2ptag.reg{color:var(--warn)}
.a2ptag.ok{color:var(--ok)}   .a2ptag.bad{color:var(--coral)}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--paper);
  font:400 15px/1.55 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:var(--peri)}

/* ── login ── */

  border-radius:16px;padding:34px 30px;position:relative}

  background:linear-gradient(225deg,var(--navy) 50%,rgba(134,139,223,.28) 50%);border-top-right-radius:16px}

.card .lg .logo{width:43px;height:40px}
.toprow .logo{width:34px;height:32px}
.card .lg b{font:700 17px/1 "Poppins",sans-serif}
.card h1{font:600 21px/1.3 "Poppins",sans-serif;margin:0 0 6px;letter-spacing:-.02em}
.card p.s{color:var(--muted);font-size:13.5px;margin:0 0 22px}
label{display:block;font-size:13px;font-weight:500;margin:0 0 6px}
input,select,textarea{width:100%;background:var(--navy-3);color:var(--paper);
  border:1px solid var(--line);border-radius:9px;padding:11px 13px;
  font:400 15px "IBM Plex Sans",sans-serif}
input:focus,select:focus,textarea:focus{outline:2px solid var(--peri);outline-offset:1px;border-color:transparent}
.fg{margin-bottom:15px}
.btn{cursor:pointer;border:0;border-radius:10px;padding:13px 22px;
  font:600 15px "Poppins",sans-serif;color:#12060A;
  background:linear-gradient(100deg,var(--blush),var(--coral));transition:.16s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.w{width:100%}
.btn.ghost{background:var(--navy-3);color:var(--paper);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--line-2);background:var(--navy-4)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:8px}
.msg{font-size:13.5px;margin-top:14px;display:none}
.msg.on{display:block}
.msg.bad{color:var(--coral)}

/* ── app shell ── */
#app{display:none;min-height:100vh;grid-template-columns:390px 1fr}
#app.on{display:grid}
.pane{border-right:1px solid var(--line);display:flex;flex-direction:column;
  height:100vh;position:sticky;top:0}
.top{padding:16px 18px;border-bottom:1px solid var(--line);background:var(--navy-2)}
.toprow{display:flex;align-items:center;gap:10px;margin-bottom:13px}

.toprow b{font:700 15px/1 "Poppins",sans-serif;flex:1}
.bell{position:relative;background:var(--navy-3);border:1px solid var(--line);
  border-radius:8px;width:32px;height:32px;color:var(--muted);cursor:pointer;font-size:14px}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--coral);color:#150609;
  font:700 10px/16px "IBM Plex Mono",monospace;min-width:17px;height:17px;
  border-radius:9px;padding:0 4px;display:none}
.bell b.on{display:block}
.filters{display:flex;gap:7px}
.filters select,.filters input{padding:8px 10px;font-size:13px;border-radius:8px}
.filters input{flex:1}

.list{overflow-y:auto;flex:1;padding:8px}
.row{padding:13px 14px;border-radius:10px;cursor:pointer;border:1px solid transparent;
  margin-bottom:5px;transition:.14s;position:relative}
.row:hover{background:var(--navy-2);border-color:var(--line)}
.row.sel{background:rgba(241,83,104,.10);border-color:rgba(241,83,104,.42)}
.row .r1{display:flex;align-items:baseline;gap:8px}
.row .nm{font-weight:600;font-size:14.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r2{display:flex;align-items:center;gap:7px;margin-top:5px;
  font:400 11.5px/1 "IBM Plex Mono",monospace;color:var(--dim)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--coral);flex:none}
.dot.hide{visibility:hidden}
.chip{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 7px;border-radius:5px;background:rgba(134,139,223,.14);color:var(--peri);
  border:1px solid var(--line);white-space:nowrap}
.chip.new{background:rgba(241,83,104,.15);color:var(--blush);border-color:rgba(241,83,104,.35)}
.chip.upd{background:rgba(255,196,107,.14);color:var(--warn);border-color:rgba(255,196,107,.32)}
.chip.live{background:rgba(78,212,160,.13);color:var(--ok);border-color:rgba(78,212,160,.32)}
.empty{padding:44px 20px;text-align:center;color:var(--dim);font-size:13.5px}

/* ── detail ── */
.detail{overflow-y:auto;height:100vh;padding:30px 34px 90px}
.dhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.dhead h2{font:600 26px/1.2 "Poppins",sans-serif;margin:0;letter-spacing:-.02em;flex:1;min-width:220px}
.dsub{color:var(--muted);font-size:14px;margin:0 0 22px}
.dsub a{color:var(--peri)}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:24px;
  padding-bottom:22px;border-bottom:1px solid var(--line)}
.bar select{width:auto;padding:8px 30px 8px 11px;font-size:13.5px;border-radius:8px;
  appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7'><path d='M1 1l4.5 4.5L10 1' stroke='%238B94AC' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center}

.grp{margin-bottom:26px}
.grp h3{font:600 12px/1 "IBM Plex Mono",monospace;letter-spacing:.11em;text-transform:uppercase;
  color:var(--coral);margin:0 0 12px}
.kv{display:grid;grid-template-columns:200px 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kv>div{background:var(--navy-2);padding:10px 13px;font-size:13.5px;min-width:0}
.kv>div:nth-child(odd){color:var(--dim);font-family:"IBM Plex Mono",monospace;font-size:12px}
.kv>div:nth-child(even){word-break:break-word;white-space:pre-wrap}
.kv .none{color:#4C5570}

/* credentials */
.cred{background:rgba(255,196,107,.05);border:1px solid rgba(255,196,107,.26);
  border-radius:11px;padding:17px 19px}
.cred .hint{font:400 12.5px/1.6 "IBM Plex Sans";color:var(--muted);margin:9px 0 0}
.credout{margin-top:13px;display:none}
.credout.on{display:block}
.credline{display:flex;gap:9px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.credline span{font:400 11.5px/1 "IBM Plex Mono",monospace;color:var(--dim);min-width:150px}
.credline code{flex:1;min-width:180px;font:400 13px/1.4 "IBM Plex Mono",monospace;
  background:var(--navy);border:1px solid var(--line);border-radius:7px;
  padding:9px 11px;word-break:break-all;color:var(--blush)}

/* versions */
.ver{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.vrow{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--navy-2)}
.vrow:last-child{border-bottom:0}
.vrow .vh{display:flex;gap:9px;align-items:baseline;font-size:13.5px}
.vrow .vh b{font:600 13px "IBM Plex Mono",monospace;color:var(--peri)}
.vrow .vh time{color:var(--dim);font-size:12px;margin-left:auto}
.diffs{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.diffs em{font:400 11px/1 "IBM Plex Mono",monospace;font-style:normal;
  padding:4px 7px;border-radius:5px;background:rgba(255,196,107,.11);
  color:var(--warn);border:1px solid rgba(255,196,107,.24)}
.diffs em.first{background:rgba(78,212,160,.11);color:var(--ok);border-color:rgba(78,212,160,.26)}

textarea{min-height:88px;resize:vertical;font-size:14px}
.blank{display:grid;place-items:center;height:100vh;color:var(--dim);text-align:center;padding:40px}
.blank div{max-width:280px}
.blank h3{font:600 17px "Poppins",sans-serif;color:var(--muted);margin:0 0 8px}

.toast{position:fixed;bottom:22px;right:22px;z-index:99;background:var(--navy-3);
  border:1px solid var(--line-2);border-left:3px solid var(--ok);border-radius:10px;
  padding:14px 18px;font-size:14px;box-shadow:0 18px 44px -14px rgba(0,0,0,.7);
  transform:translateY(140%);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-width:330px}
.toast.on{transform:none}
.toast b{display:block;font-weight:600;margin-bottom:2px}
.toast small{color:var(--muted);font-size:12.5px}

@media (max-width:980px){
  #app.on{grid-template-columns:1fr}
  .pane{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}
  .list{max-height:44vh}
  .detail{height:auto;padding:24px 18px 70px}
  .kv{grid-template-columns:1fr}
  .kv>div:nth-child(odd){padding-bottom:0;background:var(--navy-2)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="login">
  <div class="card">
    <div class="lg">
      <span class="logo" role="img" aria-label="Starling AI"></span>
      <b>Starling AI</b>
    </div>
    <h1>Onboarding console</h1>
    <p class="s">Client CRM access and integration config. Admin accounts only.</p>
    <div class="fg">
      <label for="lu">Email</label>
      <input type="email" id="lu" autocomplete="username" placeholder="admin@starlingagent.com">
    </div>
    <div class="fg">
      <label for="lp">Password</label>
      <input type="password" id="lp" autocomplete="current-password" placeholder="••••••••••">
    </div>
    <button class="btn w" id="loginBtn">Sign in</button>
    <p class="msg bad" id="loginMsg"></p>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app">
  <div class="pane">
    <div class="top">
      <div class="toprow">
        <span class="logo" role="img" aria-label="Starling AI"></span>
        <b>Onboarding</b>
        <button class="bell" id="bell" title="Unread">🔔<b id="bellCount"></b></button>
        <button class="btn ghost sm" id="out">Out</button>
      </div>
      <div class="filters">
        <input type="search" id="q" placeholder="Search name, email, brokerage…">
        <select id="fStatus">
          <option value="">All</option>
          <option value="nowizard">missing wizard</option><option value="nocrm">missing CRM access</option><option value="noa2p">missing A2P</option><option value="a2p_todo">A2P: to register</option><option value="a2p_wait">A2P: at carrier</option><option value="a2p_rej">A2P: rejected</option><option value="unread">Unread</option>
          <option value="new">New</option>
          <option value="in_setup">In setup</option>
          <option value="live">Live</option>
          <option value="paused">Paused</option>
        </select>
        <select id="fCrm"><option value="">CRM</option></select>
      </div>
    </div>
    <div class="list" id="list"><div class="empty">Loading…</div></div>
  </div>

  <div id="detail">
    <div class="blank"><div>
      <h3>Nothing selected</h3>
      <p style="font-size:13.5px;margin:0">Pick a client on the left. A red dot means they've submitted something you haven't opened yet.</p>
    </div></div>
  </div>
</div>

<div class="toast" id="toast"><b id="toastT"></b><small id="toastS"></small></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const sb = createClient(SB_URL, SB_ANON);
const $  = id => document.getElementById(id);

let rows = [], sel = null, baseTitle = document.title;

/* ─────────── auth ─────────── */
$("loginBtn").addEventListener("click", signIn);
$("lp").addEventListener("keydown", e => { if(e.key === "Enter") signIn(); });

async function signIn(){
  const btn = $("loginBtn"), msg = $("loginMsg");
  btn.disabled = true; btn.textContent = "Signing in…"; msg.classList.remove("on");

  const { error } = await sb.auth.signInWithPassword({
    email: $("lu").value.trim(), password: $("lp").value
  });

  if(error){
    msg.textContent = "That email and password didn't match. Check them and try again.";
    msg.classList.add("on");
    btn.disabled = false; btn.textContent = "Sign in";
    return;
  }
  start();
}

$("out").addEventListener("click", async () => {
  await sb.auth.signOut();
  location.reload();
});

sb.auth.getSession().then(({ data }) => { if(data.session) start(); });

async function start(){
  // is this user actually on the allowlist?
  const { data: ok } = await sb.rpc("is_starling_admin");
  if(!ok){
    $("loginMsg").textContent = "This account isn't on the admin allowlist. Ask Jason to add you.";
    $("loginMsg").classList.add("on");
    $("loginBtn").disabled = false; $("loginBtn").textContent = "Sign in";
    await sb.auth.signOut();
    return;
  }
  $("login").style.display = "none";
  $("app").classList.add("on");
  await load();
  setInterval(poll, 45000);
}

/* ─────────── data ─────────── */
async function load(){
  const { data, error } = await sb
    .from("starling_onboarding_clients")
    .select("*")
    .order("updated_at", { ascending:false });

  if(error){ $("list").innerHTML = `<div class="empty">Couldn't load: ${esc(error.message)}</div>`; return; }

  rows = data || [];
  const crms = [...new Set(rows.map(r => r.active_crm).filter(Boolean))].sort();
  const cur  = $("fCrm").value;
  $("fCrm").innerHTML = '<option value="">CRM</option>' +
    crms.map(c => `<option${c===cur?" selected":""}>${esc(c)}</option>`).join("");
  render();
}

async function poll(){
  const before = rows.filter(r => r.has_unread).length;
  const keep = sel;
  await load();
  const after = rows.filter(r => r.has_unread).length;
  if(after > before){
    const fresh = rows.find(r => r.has_unread && r.id !== keep);
    toast("New submission", fresh ? `${fresh.team_name || fresh.email} just sent an update.` : "Something new came in.");
  }
  if(keep) openClient(keep, true);
}

/* ─────────── list ─────────── */
["q","fStatus","fCrm"].forEach(id => $(id).addEventListener("input", render));

function filtered(){
  const q  = $("q").value.trim().toLowerCase();
  const st = $("fStatus").value, cm = $("fCrm").value;
  return rows.filter(r => {
    if(cm && r.active_crm !== cm) return false;
    if(st === "unread"){ if(!r.has_unread) return false; }
    else if(st === "nowizard"){ if((r.sources||[]).includes("build_your_agent")) return false; }
    else if(st === "nocrm"){ if((r.sources||[]).includes("crm_access")) return false; }
    else if(st === "noa2p"){ if((r.sources||[]).includes("a2p_compliance")) return false; }
    else if(st === "a2p_todo"){ if(r.a2p_status !== "submitted") return false; }
    else if(st === "a2p_wait"){ if(r.a2p_status !== "registering") return false; }
    else if(st === "a2p_rej"){ if(r.a2p_status !== "rejected") return false; }
    else if(st && r.status !== st) return false;
    if(!q) return true;
    return [r.team_name, r.agent_name, r.email, r.brokerage]
      .filter(Boolean).join(" ").toLowerCase().includes(q);
  });
}

function render(){
  const list = filtered();
  const unread = rows.filter(r => r.has_unread).length;
  $("bellCount").textContent = unread;
  $("bellCount").classList.toggle("on", unread > 0);
  document.title = unread ? `(${unread}) ${baseTitle}` : baseTitle;

  if(!list.length){
    $("list").innerHTML = `<div class="empty">${rows.length ? "Nothing matches that filter." : "No submissions yet. They'll show up here the moment someone sends the form."}</div>`;
    return;
  }

  $("list").innerHTML = list.map(r => {
    const isUpd = r.submission_count > 1;
    const chip  = r.status === "live"  ? '<span class="chip live">live</span>'
                : r.status === "new"   ? `<span class="chip ${isUpd?"upd":"new"}">${isUpd?"updated":"new"}</span>`
                : `<span class="chip">${esc(r.status.replace("_"," "))}</span>`;
    return `<div class="row${sel===r.id?" sel":""}" data-id="${r.id}">
      <div class="r1">
        <i class="dot${r.has_unread?"":" hide"}"></i>
        <span class="nm">${esc(r.team_name || r.agent_name || r.email)}</span>
        ${chip}
      </div>
      <div class="r2">
        <span>${esc(r.active_crm || "no crm")}</span>
        ${a2pTag(r)}
        <span>·</span>
        <span>v${r.submission_count}</span>
        <span>·</span>
        <span>${when(r.updated_at)}</span>
      </div>
    </div>`;
  }).join("");

  [...$("list").querySelectorAll(".row")].forEach(el =>
    el.addEventListener("click", () => openClient(el.dataset.id)));
}

/* ─────────── detail ─────────── */
async function openClient(id, quiet){
  sel = id;
  const r = rows.find(x => x.id === id);
  if(!r) return;
  render();

  const { data: vers } = await sb
    .from("starling_onboarding_versions")
    .select("version, changed_fields, submitted_at, source")
    .eq("client_id", id)
    .order("version", { ascending:false });

  const p = r.payload || {};

  $("detail").innerHTML = `
    <div class="dhead">
      <h2>${esc(r.team_name || r.agent_name || r.email)}</h2>
      ${r.has_unread ? '<button class="btn sm" id="markRead">Mark read</button>' : ""}
    </div>
    <p class="dsub">
      ${esc(r.agent_name || "—")} · ${esc(r.brokerage || "—")} ·
      <a href="mailto:${esc(r.email)}">${esc(r.email)}</a>
      ${r.owner_mobile ? ` · <a href="tel:${esc(r.owner_mobile)}">${esc(r.owner_mobile)}</a>` : ""}
    </p>

    <div class="bar">
      <select id="status">
        ${["new","in_setup","live","paused","archived"].map(s =>
          `<option value="${s}"${r.status===s?" selected":""}>${s.replace("_"," ")}</option>`).join("")}
      </select>
      <button class="btn ghost sm" id="copyCfg">Copy CONFIG block</button>
      ${(r.sources||[]).includes("a2p_compliance") ? "" : `<button class="btn sm" id="sendA2P">${r.a2p_invite_sent_at ? "Resend compliance email" : "📧 Send compliance email"}</button>`}
      <span class="chip">v${r.submission_count}</span>
      <span class="chip">${esc(r.active_crm || "no crm")}</span>
      ${(r.sources||[]).map(x => `<span class="chip">${esc(SRC_LABEL[x] || x)}</span>`).join("")}
      ${(r.sources||[]).includes("build_your_agent") ? "" : '<span class="chip" style="opacity:.55">no wizard yet</span>'}
      ${(r.sources||[]).includes("crm_access")       ? "" : '<span class="chip" style="opacity:.55">no CRM access yet</span>'}
      ${(r.sources||[]).includes("a2p_compliance")   ? "" : '<span class="chip" style="opacity:.55">no A2P yet</span>'}
    </div>

    ${r.has_credentials ? `
    <div class="grp">
      <h3>Credentials</h3>
      <div class="cred">
        <button class="btn sm" id="reveal">Reveal credentials</button>
        <p class="hint">Stored encrypted. Every reveal is logged with your user ID and timestamp.
        ${r.cred_hint ? `Fingerprint: <code style="color:var(--warn)">${esc(r.cred_hint)}</code>` : ""}</p>
        <div class="credout" id="credout"></div>
      </div>
    </div>` : `
    <div class="grp">
      <h3>Credentials</h3>
      <div class="kv"><div>status</div><div class="none">None submitted — they chose the user-invite path, or left it blank.</div></div>
    </div>`}

    <div class="grp">
      <h3>Business</h3>
      ${kv({
        "Team":        r.team_name,
        "Agent":       r.agent_name,
        "Agent 1st":   p["client.agent_first_name"],
        "Brokerage":   r.brokerage,
        "Type":        r.business_type,
        "Time zone":   (p["client.timezone"]||"").split("|")[0],
        "Language":    r.language,
        "ITIN":        p["client.enable_itin"] ? "yes" : "no",
        "Market":      p["locations.market_1"],
        "Market 2":    p["locations.market_2"],
        "Office":      p["locations.office_address_1"]
      })}
    </div>

    <div class="grp">
      <h3>Integration</h3>
      ${kv({
        "CRM":            r.active_crm,
        "Calendar":       r.active_calendar,
        "FUB invitee":    p["follow_up_boss.calendar_invitee_user_id"],
        "FUB old leads":  p["follow_up_boss.old_lead_assigned_user_id"],
        "User invite":    p["follow_up_boss.invite_instead"] || p["go_high_level.invite_instead"],
        "GHL location":   p["go_high_level.location_id"],
        "GHL calendar":   p["go_high_level.calendar_id"],
        "Lofty new":      p["lofty.calendar_assigned_user_id"],
        "Lofty old":      p["lofty.old_lead_assigned_user_id"],
        "BoldTrail user": p["bold_trail.assigned_user_id"],
        "BoldTrail tag":  p["bold_trail.filter_tag"],
        "RG site uuid":   p["real_geeks.site_uuid"],
        "RG user id":     p["real_geeks.user_id"],
        "SF org":         p["jungo.org_url"],
        "SF admin":       p["jungo.admin_contact"],
        "SF object":      p["jungo.lead_object"],
        "Other CRM":      p["other_crm.name"],
        "Other notes":    p["other_crm.notes"]
      })}
    </div>

    <div class="grp">
      <h3>Booking</h3>
      ${kv({
        "Days":         Array.isArray(p["hours.days"]) ? p["hours.days"].join(", ") : p["hours.days"],
        "Window":       (p["hours.start"]||"") + (p["hours.end"] ? " – " + p["hours.end"] : ""),
        "Length":       p["scheduling.meeting_minutes"] ? p["scheduling.meeting_minutes"] + " min" : "",
        "Notice":       p["scheduling.lead_time_minutes"] ? p["scheduling.lead_time_minutes"] + " min" : "",
        "Meeting type": p["locations.default_meeting_type"],
        "Skip today":   p["scheduling.skip_today"],
        "8am–8pm gate": p["texting_compliance.enabled"] ? "on" : "off",
        "States":       p["texting_compliance.states"]
      })}
    </div>

    <div class="grp">
      <h3>Agent build <span style="color:var(--dim);font-weight:400">— build-your-agent.html</span></h3>
      ${kv({
        "Intro line":     p["agent.intro_line"],
        "Industry other": p["agent.industry_other"],
        "Lead sources":   p["agent.lead_sources"],
        "Alert cell":     p["client.owner_mobile"],
        "Booking window": p["scheduling.max_days_ahead"] ? p["scheduling.max_days_ahead"] + " days" : "",
        "Blackout":       p["agent.blackout_dates"],
        "Own Google Cal": p["agent.use_own_google_calendar"] === undefined ? "" : (p["agent.use_own_google_calendar"] ? "yes" : "no"),
        "Socials":        p["agent.connect_social"],
        "Wants Starling CRM": p["agent.wants_starling_crm_social"] === undefined ? "" : (p["agent.wants_starling_crm_social"] ? "yes" : "no"),
        "CRM (their words)":  p["agent.crm_other"],
        "CRM login":      p["agent.crm_login_email"],
        "Referral link":  p["agent.referral_link"],
        "Opt-in":         p["agent.optin_confirmed"] === undefined ? "" : (p["agent.optin_confirmed"] ? "confirmed" : "not confirmed"),
        "Their notes":    p["agent.notes"]
      })}
    </div>

    ${(r.sources||[]).includes("a2p_compliance") ? `
    <div class="grp">
      <h3>A2P compliance <span style="color:var(--dim);font-weight:400">— compliance.html</span></h3>
      <div class="a2pseg" id="a2pSeg" role="group" aria-label="A2P registration status">
        ${Object.entries(A2P).map(([k, v]) =>
          `<button type="button" data-a2p="${k}" class="${v[0]}${r.a2p_status === k ? " on" : ""}"><i></i>${v[1]}</button>`
        ).join("")}
      </div>
      <p class="a2phint">Submitted = form in · Registering = being entered in Twilio · Approved / Rejected = carrier verdict</p>
      ${kv({
        "Legal name":   p["a2p.legal_business_name"],
        "DBA":          p["a2p.dba_name"],
        "Entity":       p["a2p.entity_type"],
        "EIN":          p["a2p.ein"],
        "Industry":     p["a2p.industry"],
        "Address":      [p["a2p.street"], p["a2p.city"], p["a2p.state"], p["a2p.zip"]].filter(Boolean).join(", "),
        "Website":      p["a2p.website"] || (p["a2p.website_build_requested"] ? "⚠ NEEDS BUILD — send quote" : ""),
        "Owns domain":  p["a2p.owns_domain"],
        "Their domain": p["a2p.existing_domain"],
        "Authorized rep": [p["a2p.rep_name"], p["a2p.rep_title"]].filter(Boolean).join(" · "),
        "Rep email":    p["a2p.rep_email"],
        "Rep phone":    p["a2p.rep_phone"]
      })}
      <h4 style="margin:14px 0 6px;font-size:13px;color:var(--dim);font-weight:600">Campaign</h4>
      ${kv({
        "Use case":     p["a2p.use_case"],
        "Volume":       p["a2p.monthly_volume"],
        "Samples":      p["a2p.sample_messages"],
        "Has links":    p["a2p.includes_links"] === undefined ? "" : (p["a2p.includes_links"] ? "yes" : "no"),
        "Link domain":  p["a2p.link_domain"],
        "Has phone":    p["a2p.includes_phone"] === undefined ? "" : (p["a2p.includes_phone"] ? "yes" : "no")
      })}
      <h4 style="margin:14px 0 6px;font-size:13px;color:var(--dim);font-weight:600">Consent evidence</h4>
      ${kv({
        "Lead sources":   p["a2p.lead_sources"],
        "Other source":   p["a2p.other_lead_source"],
        "Opt-in method":  p["a2p.optin_method"],
        "Opt-in URL":     p["a2p.optin_url"],
        "Screenshot":     p["a2p.optin_screenshot"],
        "Privacy URL":    p["a2p.privacy_url"],
        "SMS clause":     p["a2p.privacy_sms_clause"] === undefined ? "" : (p["a2p.privacy_sms_clause"] ? "confirmed" : "⚠ not confirmed"),
        "Consent records": p["a2p.consent_records"]
      })}
      <h4 style="margin:14px 0 6px;font-size:13px;color:var(--dim);font-weight:600">Attestations &amp; signature</h4>
      ${kv({
        "Attestations": p["a2p.attestations_complete"],
        "Signed by":    [p["a2p.signature_name"], p["a2p.signature_title"]].filter(Boolean).join(" · "),
        "Signed date":  p["a2p.signature_date"],
        "E-sign":       p["a2p.esign_consent"] === undefined ? "" : (p["a2p.esign_consent"] ? "consented" : "⚠ not consented"),
        "Timestamp":    p["a2p.signed_at_iso"]
      })}
    </div>` : ""}

    <div class="grp">
      <h3>Handoff &amp; voice</h3>
      ${kv({
        "Lender":       p["links.mortgage_name"],
        "Lender link":  p["links.mortgage_link"],
        "Credit":       p["links.credit_repair_name"],
        "Credit link":  p["links.credit_repair_link"],
        "Office phone": p["contact.office_phone_1"],
        "First SMS":    p["messages.first_sms_message"],
        "Never say":    p["messages.guardrails"],
        "Notes":        p["messages.notes"]
      })}
    </div>

    <div class="grp">
      <h3>Signed</h3>
      ${kv({
        "Signature": p["auth.signature"],
        "Date":      p["auth.date"],
        "CRM access": p["auth.access"],
        "Consent":    p["auth.consent"]
      })}
    </div>

    <div class="grp">
      <h3>History — ${(vers||[]).length} submission${(vers||[]).length===1?"":"s"}</h3>
      <div class="ver">
        ${(vers||[]).map(v => `
          <div class="vrow">
            <div class="vh"><b>v${v.version}</b>
              <span class="chip" style="font-size:10px">${esc(SRC_LABEL[v.source] || v.source || "—")}</span>
              <span style="color:var(--muted)">${v.changed_fields?.length ? v.changed_fields.length + " field(s) changed" : "no field changes"}</span>
              <time>${when(v.submitted_at)}</time>
            </div>
            ${v.changed_fields?.length ? `<div class="diffs">${
              v.changed_fields.map(f => `<em class="${f.startsWith("—")?"first":""}">${esc(f)}</em>`).join("")
            }</div>` : ""}
          </div>`).join("") || '<div class="vrow"><span style="color:var(--dim)">No history.</span></div>'}
      </div>
    </div>

    <div class="grp">
      <h3>Internal notes</h3>
      <textarea id="notes" placeholder="Where this stands, who's on it, what's blocking…">${esc(r.internal_notes||"")}</textarea>
      <button class="btn ghost sm" id="saveNotes" style="margin-top:9px">Save notes</button>
    </div>
  `;

  wire(r);
  if(r.has_unread && !quiet) markRead(r.id);
}

function wire(r){
  const on = (id, fn) => { const el = $(id); if(el) el.addEventListener("click", fn); };

  on("markRead", () => markRead(r.id));

  on("reveal", async e => {
    e.target.disabled = true; e.target.textContent = "Decrypting…";
    const { data, error } = await sb.rpc("reveal_starling_credentials", { p_client_id: r.id });
    if(error){
      e.target.disabled = false; e.target.textContent = "Reveal credentials";
      toast("Couldn't decrypt", error.message);
      return;
    }
    e.target.style.display = "none";
    const box = $("credout");
    box.classList.add("on");
    box.innerHTML = Object.entries(data || {}).filter(([,v]) => v).map(([k,v]) =>
      `<div class="credline"><span>${esc(k)}</span><code>${esc(v)}</code>
       <button class="btn ghost sm" data-copy="${esc(v)}">Copy</button></div>`).join("")
      || '<p class="hint">Nothing stored.</p>';
    [...box.querySelectorAll("[data-copy]")].forEach(b =>
      b.addEventListener("click", () => {
        navigator.clipboard.writeText(b.dataset.copy);
        b.textContent = "Copied";
        setTimeout(() => b.textContent = "Copy", 1600);
      }));
  });

  on("copyCfg", async e => {
    let cfg = JSON.parse(JSON.stringify(r.config_json || {}));
    if(r.has_credentials){
      const { data } = await sb.rpc("reveal_starling_credentials", { p_client_id: r.id });
      // drop the real keys back into the redacted config block
      const walk = o => { for(const k in o){
        if(o[k] && typeof o[k] === "object") walk(o[k]);
        else if(typeof o[k] === "string" && o[k].startsWith("«")){
          const hit = Object.entries(data||{}).find(([n]) => n.endsWith("." + k) || n === k);
          if(hit) o[k] = hit[1];
        }
      }};
      walk(cfg);
    }
    navigator.clipboard.writeText(JSON.stringify(cfg, null, 2));
    e.target.textContent = "Copied — paste into CONFIG";
    setTimeout(() => e.target.textContent = "Copy CONFIG block", 2200);
  });

  const st = $("status");
  if(st) st.addEventListener("change", async () => {
    const { error } = await sb.from("starling_onboarding_clients")
      .update({ status: st.value }).eq("id", r.id);
    if(error) return toast("Couldn't save", error.message);
    r.status = st.value; render();
    toast("Status saved", `Now "${st.value.replace("_"," ")}".`);
  });

  const seg = $("a2pSeg");
  if(seg) seg.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", async () => {
      const v = b.dataset.a2p;
      if(r.a2p_status === v) return;
      const { error } = await sb.from("starling_onboarding_clients")
        .update({ a2p_status: v }).eq("id", r.id);
      if(error) return toast("Couldn't save", error.message);
      r.a2p_status = v;
      seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.a2p === v));
      render();
      toast("A2P status saved", `Now "${A2P[v][1]}".`);
    }));

  const sBtn = $("sendA2P");
  if(sBtn) sBtn.addEventListener("click", async () => {
    const w = window.open(complianceMail(r), "_blank", "noopener");
    if(!w) return toast("Popup blocked", "Allow popups for this site, then click again.");
    const ts = new Date().toISOString();
    const { error } = await sb.from("starling_onboarding_clients")
      .update({ a2p_invite_sent_at: ts }).eq("id", r.id);
    if(error) return toast("Compose opened", "Couldn't stamp the record: " + error.message);
    r.a2p_invite_sent_at = ts;
    render();
    toast("Compose opened in Gmail", "Review, personalize the greeting, hit Send. Marked as invited.");
    openClient(r.id, true);
  });

  on("saveNotes", async e => {
    const { error } = await sb.from("starling_onboarding_clients")
      .update({ internal_notes: $("notes").value }).eq("id", r.id);
    if(error) return toast("Couldn't save", error.message);
    r.internal_notes = $("notes").value;
    e.target.textContent = "Saved";
    setTimeout(() => e.target.textContent = "Save notes", 1600);
  });
}

async function markRead(id){
  await sb.from("starling_onboarding_clients").update({ has_unread:false }).eq("id", id);
  const r = rows.find(x => x.id === id);
  if(r) r.has_unread = false;
  render();
  const b = $("markRead"); if(b) b.remove();
}

$("bell").addEventListener("click", () => {
  $("fStatus").value = $("fStatus").value === "unread" ? "" : "unread";
  render();
});

/* ─────────── helpers ─────────── */
const SRC_LABEL = { build_your_agent:"wizard", crm_access:"CRM access", a2p_compliance:"A2P" };
const A2P = {
  submitted:   ["sub","Submitted"],
  registering: ["reg","Registering"],
  approved:    ["ok","Approved"],
  rejected:    ["bad","Rejected"]
};
function complianceMail(r){
  const biz = r.team_name || r.agent_name || "your business";
  const subject = biz + " — one step left before your AI can text (A2P registration)";
  const body = [
    "Hi there,",
    "",
    "Great news — your Starling AI agent build is in and we're configuring it now.",
    "",
    "One required step before your number can go live: U.S. carriers require every business that sends text messages to register who they are and how their contacts opted in (it's called A2P 10DLC). Until you're registered, carriers block the texts — so this step unlocks everything.",
    "",
    "It takes about 10 minutes:",
    "https://starlingagent.com/compliance",
    "",
    "Have handy:",
    "- Your EIN (or choose sole proprietor if you don't have one)",
    "- Your business website (no website? the form has an option — we can build you a compliance-ready one)",
    "- Your privacy policy link",
    "",
    "Important: use this same email address (" + r.email + ") on the form so it links to your account.",
    "",
    "Once you submit, we register your business with the carriers — approval typically takes 3–7 business days — and your agent starts texting the moment it clears.",
    "",
    "Questions? Just reply to this email — we answer fast.",
    "",
    "— The Starling AI Team",
    "Admin@starlingagent.com · starlingagent.com"
  ].join("\n");
  return "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(r.email)
       + "&su=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
}
const a2pTag = r => {
  if(!r.a2p_status || !A2P[r.a2p_status]){
    if(r.a2p_invite_sent_at && !(r.sources||[]).includes("a2p_compliance"))
      return `<span>·</span><span class="a2ptag" style="opacity:.6">invited ${when(r.a2p_invite_sent_at)}</span>`;
    return "";
  }
  const [cls] = A2P[r.a2p_status];
  const txt = r.a2p_status === "approved" ? "A2P ✓"
            : r.a2p_status === "rejected" ? "A2P ✗"
            : "A2P " + r.a2p_status;
  return `<span>·</span><span class="a2ptag ${cls}">${txt}</span>`;
};

function kv(obj){
  const e = Object.entries(obj).filter(([,v]) => v !== undefined && v !== null && v !== "");
  if(!e.length) return '<div class="kv"><div>—</div><div class="none">Nothing filled in.</div></div>';
  return '<div class="kv">' + e.map(([k,v]) =>
    `<div>${esc(k)}</div><div>${esc(String(v))}</div>`).join("") + "</div>";
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function when(ts){
  const d = new Date(ts), m = (Date.now() - d) / 60000;
  if(m < 1)    return "just now";
  if(m < 60)   return Math.floor(m) + "m ago";
  if(m < 1440) return Math.floor(m/60) + "h ago";
  if(m < 10080)return Math.floor(m/1440) + "d ago";
  return d.toLocaleDateString("en-US", { month:"short", day:"numeric" });
}
let toastTimer;
function toast(title, sub){
  $("toastT").textContent = title;
  $("toastS").textContent = sub || "";
  $("toast").classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("on"), 5200);
}
</script>
